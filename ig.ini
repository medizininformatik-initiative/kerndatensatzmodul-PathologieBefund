[IG]
; MII KDS module IG build configuration.
;
; [IG] MUST be the very first line: the IG Publisher's checkNewIg() rejects an
; ig.ini whose content does not start with "[IG]", so any leading comment would
; make the build fail with "unable to find an ig.ini".
;
; template = the vendored MII IG template in ig-template/ (a leading `#` means a
;            LOCAL template folder relative to this IG root). The published
;            package `de.medizininformatikinitiative.template` is not on a FHIR
;            package registry yet, so the alternative would be the template
;            repository URL, fetched at build time and following its default
;            branch. We use the vendored folder instead: it builds offline and
;            byte-stable against a committed copy.
;
;            ig-template/ is a mirror of
;            https://github.com/medizininformatik-initiative/ig-template-mii-kds
;            and is refreshed by scripts/sync-ig-template.sh (`--check` fails on
;            drift). Do not edit it in place.
;
;            Floating labels (#current / #latest / #dev / #cibuild) are out —
;            they are what the previous `fhir2.base.template#current` used, and
;            they make a build unreproducible.
ig = fsh-generated/resources/ImplementationGuide-mii-ig-modul-patho.json
template = #ig-template
auto-activate-narrative-generator=false
