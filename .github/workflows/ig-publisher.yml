# IG build + GitHub Pages branch preview.
#
# Thin caller of the reusable build in mii-kds-module-template
# (.github/workflows/ci_build.yml). Steps, toolchain pins and the preview
# layout (gh-pages/branches/<branch>/) live there; this file says when to
# build and which module-specific hooks run. Dependabot proposes a new SHA
# with each template release (docs/adr/0006 in the template).
name: IG build and preview

on:
  push:
    branches:
      - "**"
      - "!main"
      - "!gh-pages"
      - "!fsh-generated"
  workflow_dispatch:

permissions:
  contents: write # push previews to the gh-pages branch
  pages: write # PAGES_ACTIONS_ENABLED deploy path
  id-token: write # deploy-pages OIDC
  pull-requests: write # upsert the preview-URL PR comment
  issues: write # PR comments go through the issues API

concurrency:
  # Serialize every writer of the gh-pages branch (previews, cleanup and the
  # formal go-publish share this group). Queue, never cancel.
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  build:
    uses: medizininformatik-initiative/mii-kds-module-template/.github/workflows/ci_build.yml@0fe43b730ff59ab6fea9c87ffb708f5c64a2dfa0 # v0.15.0
    with:
      pre-sushi-command: |
        tool="${RUNNER_TEMP}/fhir-pkg-tool.jar"
        curl --fail --location --silent --show-error https://github.com/Gefyra/fhir-pkg-tool/releases/download/v0.3.0/fhir-pkg-tool.jar --output "${tool}"
        echo "8ce35d3b16c9c4abf7713136d2a560eab009f561507b25e8829798deff879864  ${tool}" | sha256sum --check
        "${JAVA_HOME_21_X64}/bin/java" -Xmx2g -jar "${tool}" --sushi-deps-file sushi-config.yaml
    secrets: inherit
